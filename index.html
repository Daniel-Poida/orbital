<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0714">
  <title>Orbital</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="scene"></canvas>

  <header class="topbar">
    <button id="planet-btn" class="pill" type="button" aria-label="Выбрать планету">
      <span class="dot" id="planet-dot"></span>
      <span id="planet-name">Планета</span>
      <span class="muted" id="planet-artist"></span>
    </button>
    <div class="topbar-right">
      <span class="pill static"><span id="bpm-label">110</span> bpm</span>
      <button id="editor-return" class="pill hidden" type="button">Редактор</button>
      <button id="share-btn" class="pill" type="button" aria-label="Поделиться">Поделиться</button>
    </div>
  </header>

  <div id="hint" class="hint" aria-live="polite"></div>

  <section class="panel">
    <div class="row">
      <span class="row-title">Спутники</span>
      <div id="palette" class="chips" role="listbox" aria-label="Семплы планеты"></div>
    </div>
    <div class="row">
      <span class="row-title">Кольца</span>
      <div id="rings" class="chips" role="group" aria-label="Длинные звуки"></div>
    </div>
    <div class="row controls">
      <button id="play-btn" class="btn primary" type="button" aria-label="Играть">▶</button>
      <div class="group">
        <button id="orbit-minus" class="btn" type="button" aria-label="Убрать орбиту">−</button>
        <span class="group-label"><span id="orbit-count">3</span> орб.</span>
        <button id="orbit-plus" class="btn" type="button" aria-label="Добавить орбиту">+</button>
      </div>
      <label class="slider">
        <span>Темп</span>
        <input id="bpm" type="range" min="60" max="180" step="1" value="110">
      </label>
      <button id="clear-btn" class="btn" type="button" aria-label="Очистить орбиты">Сброс</button>
    </div>
  </section>

  <div id="start" class="overlay">
    <div class="card">
      <h1 id="start-title">Orbital</h1>
      <p>Расставь спутники по орбитам планеты, включи кольца и собери свой бит из звуков артиста.</p>
      <button id="start-btn" class="btn primary big" type="button">Запустить звук</button>
      <p class="small">Семплы: <span id="load-status">загрузка…</span></p>
    </div>
  </div>

  <div id="picker" class="overlay hidden">
    <div class="card">
      <h2>Планеты</h2>
      <div id="planet-list" class="list"></div>
      <button id="editor-open" class="btn" type="button" style="margin-top:12px;width:100%">Создать свою планету</button>
      <button class="btn close" type="button" data-close="picker">Закрыть</button>
    </div>
  </div>

  <div id="share" class="overlay hidden">
    <div class="card">
      <h2>Поделиться</h2>
      <p class="small">Ссылка хранит расстановку спутников и колец. Кто откроет, услышит то же самое.</p>
      <input id="share-url" type="text" readonly>
      <div class="actions">
        <button id="copy-btn" class="btn primary" type="button">Скопировать</button>
        <a id="track-link" class="btn" href="#" target="_blank" rel="noopener">Послушать трек</a>
      </div>
      <button class="btn close" type="button" data-close="share">Закрыть</button>
    </div>
  </div>

  <div id="editor" class="overlay editor hidden">
    <div id="editor-card" class="card editor-card"></div>
  </div>

  <div id="drag-ghost" class="ghost hidden"></div>
  <audio id="unlock" preload="auto" playsinline src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA="></audio>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/audio.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
