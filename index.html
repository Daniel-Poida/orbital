<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#07060d">
  <title>Orbital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=202610061727">
</head>
<body>
  <canvas id="scene"></canvas>

  <header class="topbar">
    <button id="planet-btn" class="pill" type="button" aria-label="Выбрать планету">
      <span class="dot" id="planet-dot"></span>
      <span id="planet-name">Планета</span>
      <span class="muted" id="planet-artist"></span>
    </button>
    <div class="topbar-right">
      <span class="pill static bpm"><b id="bpm-label">110</b><small>bpm</small></span>
      <button id="editor-return" class="pill hidden" type="button">Редактор</button>
      <button id="share-btn" class="pill icon" type="button" aria-label="Поделиться"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v13"/><path d="m7 8 5-5 5 5"/></svg><span class="lbl">Поделиться</span></button>
    </div>
  </header>

  <div id="hint" class="hint" aria-live="polite"></div>

  <section class="panel dock">
    <nav class="tabs" role="tablist" aria-label="Разделы">
      <button type="button" role="tab" class="tab on" data-tab="sounds" aria-selected="true">Звуки</button>
      <button type="button" role="tab" class="tab" data-tab="rings" aria-selected="false">Кольца</button>
      <button type="button" role="tab" class="tab" data-tab="mixer" aria-selected="false">Микшер</button>
      <button type="button" role="tab" class="tab" data-tab="master" aria-selected="false">Мастер</button>
      <span class="tab-ind" aria-hidden="true"></span>
    </nav>

    <div class="pane on" data-pane="sounds">
      <div id="palette" class="chips" role="listbox" aria-label="Семплы планеты"></div>
    </div>
    <div class="pane" data-pane="rings">
      <div id="rings" class="chips" role="group" aria-label="Длинные звуки"></div>
    </div>
    <div class="pane" data-pane="mixer"><div id="mixer" class="mixer"></div></div>
    <div class="pane" data-pane="master"><div id="master" class="master"></div></div>

    <div class="transport">
      <button id="play-btn" class="play" type="button" aria-label="Играть"><span class="ic-play"></span></button>
      <div class="stepper">
        <button id="orbit-minus" type="button" aria-label="Убрать орбиту">−</button>
        <span><b id="orbit-count">3</b><small>орбиты</small></span>
        <button id="orbit-plus" type="button" aria-label="Добавить орбиту">+</button>
      </div>
      <label class="tempo">
        <span class="sr">Темп</span>
        <input id="bpm" type="range" min="60" max="180" step="1" value="110">
      </label>
      <button id="clear-btn" class="ghostbtn" type="button" aria-label="Очистить орбиты">Сброс</button>
    </div>
  </section>

  <div id="start" class="overlay">
    <div class="card">
      <span class="eyebrow">Orbital</span>
      <h1 id="start-title">Orbital</h1>
      <p>Расставь спутники по орбитам планеты, включи кольца, сведи звук и собери свой бит из звуков артиста.</p>
      <button id="start-btn" class="btn primary big" type="button">Запустить звук</button>
      <p class="small">Семплы: <span id="load-status">загрузка…</span></p>
    </div>
  </div>

  <div id="picker" class="overlay hidden">
    <div class="card">
      <h2>Планеты</h2>
      <div id="planet-list" class="list"></div>
      <button id="editor-open" class="btn" type="button" style="margin-top:12px;width:100%">Создать свою планету</button>
      <button class="btn close" type="button" data-close="picker">Закрыть</button>
    </div>
  </div>

  <div id="share" class="overlay hidden">
    <div class="card">
      <h2>Поделиться</h2>
      <p class="small">Ссылка хранит расстановку спутников и колец. Кто откроет, услышит то же самое.</p>
      <input id="share-url" type="text" readonly>
      <div class="actions">
        <button id="copy-btn" class="btn primary" type="button">Скопировать</button>
        <a id="track-link" class="btn" href="#" target="_blank" rel="noopener">Послушать трек</a>
      </div>
      <button class="btn close" type="button" data-close="share">Закрыть</button>
    </div>
  </div>

  <div id="editor" class="overlay editor hidden">
    <div id="editor-card" class="card editor-card"></div>
  </div>

  <div id="drag-ghost" class="ghost hidden"></div>
  <audio id="unlock" preload="auto" playsinline src="data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YSADAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=="></audio>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="js/scene.js?v=202610061727"></script>
  <script src="js/audio.js?v=202610061727"></script>
  <script src="js/mixer.js?v=202610061727"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="js/editor.js?v=202610061727"></script>
  <script src="js/app.js?v=202610061727"></script>
</body>
</html>
